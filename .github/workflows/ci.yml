name: ETW CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Syntax and Bytecode Compilation Check
        run: |
          python -m compileall src/ tests/ tools/ scripts/

      - name: Run Test Suites
        run: |
          pytest -v tests/ tools/agent-observability/tests/

      - name: Run Benchmark Verification
        run: |
          etw benchmark run -o benchmark/results/benchmark_report.json

      - name: Run End-to-End Walkthrough Demonstration
        run: |
          python scripts/verify_demo_cli.py
