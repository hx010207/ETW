[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-triage-workbench"
version = "0.2.0"
description = "Local-first post-detection triage workbench for security findings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
]

[project.scripts]
etw = "etw.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
